<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PelisPacio - Sistema de Usuarios</title>
  <link rel="stylesheet" href="pro2.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>PelisPacio 🎬</h1>
    </header>

    <!-- FORMULARIO DE LOGIN -->
    <div id="login-box" class="form-box">
      <h2>Iniciar Sesión</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Correo electrónico" required>
        <input type="password" id="login-password" placeholder="Contraseña" required>
        <button type="submit" href="hogar.html">Entrar</button>
      </form>
      <p>¿No tienes cuenta? <a href="suscrip.html" id="show-register">Regístrate aquí</a></p>
    </div>
  
  </div>
  <script src="script2.js"></script>
</body>
</html>
